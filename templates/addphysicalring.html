{% extends 'base.html' %}
{% block customstyle %}
{% endblock %}
{% block title %}Fizikai csengő hozzáadása{% endblock %}
{% block headtitle %}Fizikai csengő hozzáadása{% endblock %}
{% block content %}

<form method="post" action="#">
    <div class="mb-3">
        <label for="name" class="form-label">Név:</label>
        <input type="text" name="name" id="name" class="form-control">
    </div>
    <div class="mb-3">
        <label for="pin" class="form-label">Tüske (Broadcom BCM számozás alapján):</label>
        <input type="number" name="pin" id="pin" class="form-control">
    </div>
    <div class="mb-3">
        <div id="reverse">
            <div class="form-check form-check-inline">
                <input type="checkbox" name="reverse" id="reversecheck" value="1" class="form-check-input">
                <label for="reversecheck" class="form-check-label">Fordított működés (bekapcsoláskor a GND-re húzza, kikapcsoláskor a 3.3V-ra)</label>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Mentés</button>
</form>

{% endblock %}
